name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # Pinned so a runner image update can't silently change the compiler.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/cache@v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-xcode26.6-

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests App/Sources Package.swift

      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build

  app:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      # No Local.xcconfig in CI, so the app is ad-hoc signed.
      - name: Build app (warnings are errors)
        run: xcodebuild -project GamesJournal.xcodeproj -scheme GamesJournal -configuration Debug -derivedDataPath .build/xcode build

      - name: Check signature
        run: codesign --verify --verbose ".build/xcode/Build/Products/Debug/Games Journal.app"
